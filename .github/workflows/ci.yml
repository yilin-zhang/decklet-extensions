name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout decklet-extensions
        uses: actions/checkout@v4
        with:
          path: decklet-extensions

      - name: Checkout decklet core
        uses: actions/checkout@v4
        with:
          repository: yilin-zhang/decklet
          path: decklet

      - name: Read Emacs version
        id: emacs-version
        run: echo "version=$(tr -d '[:space:]' < decklet-extensions/.emacs-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Emacs
        uses: purcell/setup-emacs@master
        with:
          version: ${{ steps.emacs-version.outputs.version }}

      - name: Run checks
        env:
          DECKLET_CORE_DIR: ${{ github.workspace }}/decklet
        working-directory: decklet-extensions
        run: |
          ./scripts/check-all.sh
