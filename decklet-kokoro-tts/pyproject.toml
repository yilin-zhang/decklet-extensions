[project]
name = "decklet-kokoro-tts"
version = "0.1.0"
description = "Local Kokoro pronunciation audio generation for Decklet"
requires-python = ">=3.11,<3.13"
dependencies = [
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "kokoro>=0.9.4,<1",
  "misaki[en]>=0.9.4,<1",
  "send2trash>=1.8.3,<2",
  "soundfile>=0.13.1,<1",
]

[project.scripts]
decklet-kokoro-tts = "tools.decklet_kokoro_tts:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.hatch.metadata]
allow-direct-references = true
